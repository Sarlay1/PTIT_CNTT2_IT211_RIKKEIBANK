spring.application.name=RIKKEIBANK

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/rikkeibank?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update

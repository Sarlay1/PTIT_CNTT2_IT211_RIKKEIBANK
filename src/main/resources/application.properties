spring.application.name=RIKKEIBANK

# C?u hình database MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/rikkeibank
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# C?u hình JWT
# JWT config
app.jwt.secret=your-very-long-secret-key-at-least-32-characters
app.jwt.access-token-expiration-ms=3600000

